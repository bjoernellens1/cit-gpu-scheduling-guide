# Distributed multi-GPU PyTorch DDP training, gang-scheduled across
# 2 pods x 2 GPUs each (4 GPUs total). Read ../../docs/gang-scheduling.md
# BEFORE using this -- the PodGroup below is what makes this a real
# "all-or-nothing" gang-scheduled job, not just 2 independently-scheduled
# pods that happen to reference each other.
apiVersion: scheduling.run.ai/v2alpha2
kind: PodGroup
metadata:
  name: pytorch-ddp-multi-pod-pg
  namespace: <your-namespace>
spec:
  minMember: 2   # total pod count below (2 pods x 2 GPUs each = 4 GPUs)
  queue: batch
  priorityClassName: low-priority
---
# Headless Service for rank/master discovery. Rank 0 (pod ordinal 0 of the
# indexed Job) is reachable at
# <service-name>-0.<service-name>.<namespace>.svc.cluster.local -- used as
# MASTER_ADDR below.
apiVersion: v1
kind: Service
metadata:
  name: pytorch-ddp-multi-pod
  namespace: <your-namespace>
spec:
  clusterIP: None
  selector:
    job-name: pytorch-ddp-multi-pod
  ports:
    - name: torchrun
      port: 29500
      targetPort: 29500
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-ddp-multi-pod
  namespace: <your-namespace>
spec:
  completionMode: Indexed
  parallelism: 2
  completions: 2
  backoffLimit: 6
  template:
    metadata:
      labels:
        kai.scheduler/queue: batch
        job-name: pytorch-ddp-multi-pod
      annotations:
        # Attaches this pod to the explicit PodGroup above instead of
        # whatever per-pod PodGroup KAI's default webhook logic would create.
        pod-group-name: pytorch-ddp-multi-pod-pg
    spec:
      schedulerName: kai-scheduler
      priorityClassName: low-priority
      subdomain: pytorch-ddp-multi-pod   # required for per-ordinal DNS to register
      restartPolicy: Never                # a failure on any rank should kill the whole group
      containers:
        - name: pytorch
          image: your-registry/your-image:latest
          command: ["bash", "-c"]
          args:
            - |
              torchrun \
                --nnodes=2 \
                --nproc_per_node=2 \
                --node-rank=${JOB_COMPLETION_INDEX} \
                --master-addr=pytorch-ddp-multi-pod-0.pytorch-ddp-multi-pod \
                --master-port=29500 \
                train_ddp.py \
                  --checkpoint-dir=/checkpoints \
                  --data-dir=/data \
                  --resume-from-latest
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: OMP_NUM_THREADS
              value: "4"
          resources:
            limits:
              nvidia.com/gpu: "2"   # exclusive -- no gpu-memory annotation on this pod
              cpu: "16"
              memory: "64Gi"
            requests:
              cpu: "8"
              memory: "32Gi"
          volumeMounts:
            - name: training-data
              mountPath: /data
              readOnly: true
            - name: checkpoints
              mountPath: /checkpoints
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: training-checkpoints-pvc
# Rank 0 only should write the checkpoint (torch.distributed.get_rank() == 0
# in train_ddp.py) -- see ../../docs/storage.md for why.
