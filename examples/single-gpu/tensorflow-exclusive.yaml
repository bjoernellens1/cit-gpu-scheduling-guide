# Single-GPU, exclusive (whole-device) TensorFlow training job.
# TensorFlow counterpart of pytorch-exclusive.yaml -- same KAI scheduling,
# queue/priority, and storage conventions; see that file's comments for the
# fully detailed rationale.
apiVersion: batch/v1
kind: Job
metadata:
  name: tensorflow-single-gpu-exclusive
  namespace: <your-namespace>
  labels:
    kai.scheduler/queue: batch
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        kai.scheduler/queue: batch
    spec:
      schedulerName: kai-scheduler
      priorityClassName: low-priority
      restartPolicy: OnFailure
      containers:
        - name: trainer
          image: your-registry/your-tf-image:latest
          command: ["python"]
          args:
            - "train.py"
            - "--checkpoint-dir=/checkpoints"
            - "--data-dir=/data"
            - "--resume-from-latest"
          env:
            # Prevents TF from grabbing all GPU memory upfront.
            - name: TF_FORCE_GPU_ALLOW_GROWTH
              value: "true"
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "32Gi"
            requests:
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - name: training-data
              mountPath: /data
              readOnly: true
            - name: checkpoints
              mountPath: /checkpoints
      volumes:
        - name: training-data
          persistentVolumeClaim:
            claimName: training-data-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: training-checkpoints-pvc
